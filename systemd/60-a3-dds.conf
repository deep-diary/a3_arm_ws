# F105 — A3 DDS 网络栈内核缓冲基线（CycloneDDS/UDP）
# 安装：scripts/setup/setup_dds_network.sh → /etc/sysctl.d/60-a3-dds.conf
# 默认 208 KB 的套接字缓冲上限在 200 Hz 控制 + 突发大消息时会被打满丢包。
# 重启自动生效；setup 脚本会立即 sysctl --apply。

# UDP 套接字缓冲上限 24 MiB（Cyclone 实际申请值见 cyclonedds.xml）
net.core.rmem_max = 25165824
net.core.wmem_max = 25165824

# 默认缓冲 2 MiB（仅提高默认值，避免每个 UDP 套接字按 max 占满）
net.core.rmem_default = 2097152
net.core.wmem_default = 2097152

# 网卡接收队列在软中断消费前可缓存的最大帧数（高负载突发）
net.core.netdev_max_backlog = 2000
