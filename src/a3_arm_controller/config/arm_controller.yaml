/**:
  ros__parameters:
    # ═══════════════════════════════════════════════════════════════════
    # 1. 基础：关节、话题、初始化
    # ═══════════════════════════════════════════════════════════════════
    joint_names: [L1_joint, L2_joint, L3_joint, L4_joint, L5_joint, L6_joint, L7_joint]
    joint_states_topic: /joint_states
    control_mode_topic: /a3/control_mode
    arm_status_topic: /a3/arm_status
    torque_components_topic: /a3/hardware/torque_components
    gate_topic: /power_sequence/gate_open
    power_state_topic: /power_sequence/state
    traj_topic: /joint_group_effort_controller/joint_trajectory
    status_hz: 10.0
    init_zero_tol_rad: 0.05
    init_timeout_s: 5.0
    # 运动命令是否要求 gate_open（电源门联锁）。真机 power_sequence 在跑 → true；
    # 仿真/无电源序列才设 false。2026-10 真机开启。
    require_gate: true

    # ═══════════════════════════════════════════════════════════════════
    # 2. goto / MoveIt 点位规划
    # ═══════════════════════════════════════════════════════════════════
    goto_duration_s: 3.0
    # goto 规划时间调慢：velocity+acc 0.30→0.15 使轨迹时长约翻倍（2026-09 真机
    # "goto 挺快"，减速亦减小 JTC 跟踪误差余量）
    moveit_velocity_scaling: 0.15
    moveit_acceleration_scaling: 0.15

    # ═══════════════════════════════════════════════════════════════════
    # 3. 随机位姿巡游（F116/F134）
    # ═══════════════════════════════════════════════════════════════════
    random_tour_count: 10
    random_tour_exclude_poses: ["zero"]   # zero=机械零位，真机排除
    random_tour_leg_retries: 3            # 单腿失败重试次数
    # F134: 整序列一次规划/执行（pilz PTP blend）；false/失败回退逐腿链
    random_tour_use_sequence: true
    random_tour_blend_radius_m: 0.02

    # ═══════════════════════════════════════════════════════════════════
    # 4. 回放：ramp + 旧平滑链（legacy 兜底，仅 retime 关闭/失败时用）
    # ═══════════════════════════════════════════════════════════════════
    # 回放前从当前位姿插值到首记录点时长；LL-046 2.5s→5s 拉平回放开局下砸
    playback_ramp_duration_s: 5.0
    # F124: 回首点段走 move_group 规划（true）；false/失败回落几何 ramp
    playback_return_use_moveit: true
    # LL-047: 中心滑动平均低通（legacy 链；retime 正常路径不用）
    playback_smooth_samples: 7
    # F57/LL-053: 时间轴匀速重排（legacy 链；弧长均匀重采样 + 加速度限幅膨胀）
    playback_time_warp: true
    playback_warp_vmax_rad_s: 0.6
    playback_warp_dt_min_s: 0.02
    playback_warp_accel_max_rad_s2: 2.0

    # ═══════════════════════════════════════════════════════════════════
    # 5. 示教保存
    # ═══════════════════════════════════════════════════════════════════
    # F57/LL-053: 保存时轻量平滑（5 点中心滑动平均；0/1/2=不保存）
    teach_save_smooth_samples: 5

    # ═══════════════════════════════════════════════════════════════════
    # 6. F68 重定时 + F137 几何去噪（回放核心链路）
    # ═══════════════════════════════════════════════════════════════════
    # F133: 重定时成功后烘焙回 latest.yaml（retimed:true / f137_smoothed 标记）
    playback_retime_writeback: true
    # 后端：totg=时间最优（匹配录制时长）；ruckig=加加速度受限（更平滑但会拉长）。
    # 2026-10 真机：ruckig 对去噪轨迹仍拉长（14.65s→61s，LL-071），故用 totg，
    # JTC splines 已做最终插值平滑。
    playback_retime_backend: totg
    # 重定时目标时长 = max(录制时长, ramp)（true）；false 按 v/a 上限时间最优
    playback_match_recorded_duration: true
    # 回放速度/加速度缩放（× joint_limits.yaml 上限）。0.2→0.5 更接近示教原速
    playback_velocity_scaling: 0.5
    playback_acceleration_scaling: 0.5
    # F137: 回放前几何去噪（逐关节五次 B 样条，RMS 残差 ≈ ε rad）。0=关闭；
    # 0.005 保形、0.02 更平滑。2026-10 钢琴弹奏精度优先 → 0.005（max 偏离 ~0.03 rad≈1.7°）。
    playback_geometric_smoothing_eps: 0.002

    # ═══════════════════════════════════════════════════════════════════
    # 7. 路点示教（F131/F134：Share 长按进入，L2 打点，Options 保存）
    # ═══════════════════════════════════════════════════════════════════
    waypoint_min_count: 2                   # 路点 <2 不保存
    waypoint_min_capture_delta_rad: 0.01    # 与上一点差 <10mrad 视为重复
    waypoint_segment_retries: 2             # 单段规划/执行失败重试
    waypoint_use_sequence: true             # F134: 整序列 blend 过中间点
    waypoint_segment_timeout_s: 0.0         # 0=复用 moveit_goto_timeout_s
    waypoint_blend_radius_m: 0.02           # 拐角 blend 半径
    sequence_move_timeout_s: 90.0           # 整序列规划+执行等待上限
    # LIN 笛卡尔速度/加速度缩放（0.2 起步实测，近奇异段抖再降）
    waypoint_lin_velocity_scaling: 0.2
    waypoint_lin_acceleration_scaling: 0.2
    waypoint_lin_pos_tol_m: 0.002           # LIN 目标位姿容差
    waypoint_lin_rot_tol_rad: 0.002
    waypoint_base_link: base_link
    waypoint_ee_link: end_effector
    waypoint_lin_planning_group: arm_lin
    operator_event_topic: /a3/arm/operator_event   # 打点反馈事件

    # ═══════════════════════════════════════════════════════════════════
    # 8. move_to / goto 兜底
    # ═══════════════════════════════════════════════════════════════════
    move_to_min_duration_s: 3.0             # F41/F88: 两点轨迹最短时长

    # ═══════════════════════════════════════════════════════════════════
    # 9. 失能保护（F40 回位 / F75 落定 / F119 软失能）
    # ═══════════════════════════════════════════════════════════════════
    disable_home_pose_name: idle            # F113: home→idle
    disable_home_tol_rad: 0.15
    disable_home_duration_s: 5.0
    disable_home_confirm_s: 0.5
    disable_park_timeout_s: 8.0
    disable_home_settle_tol_rad: 0.02       # F75: 位置落定判据
    disable_home_settle_vel_rad_s: 0.05     # F75: 速度落定判据
    disable_mode_exit_timeout_s: 2.0        # F119: 退出模式等待上限

    # ═══════════════════════════════════════════════════════════════════
    # 10. 力矩统计（F43）+ 静态力矩门禁（F107）
    # ═══════════════════════════════════════════════════════════════════
    motor_states_topic: /a3/motor/states
    torque_stats_file: "~/.a3/stats/torque_stats.yaml"
    torque_stats_save_interval_s: 10.0
    # F107: 门禁上限 = joint_rated_torque × static_torque_margin_ratio。
    # 0.9→1.0 放行 L2 高位形（实测 ~4.5Nm）；额定力矩同步放宽到 RS00=7 / EL05=3
    # / EL05(L7)=2——注意 7Nm 已超 L1-L3 连续额定 5.0Nm（接近峰值 14Nm 的一半），
    # 高位形长时间保位有发热风险（温度保护 90/95°C 兜底）。
    static_torque_margin_ratio: 1.0
    # F107: 静态力矩门禁参考力矩（N·m）。已从电机连续额定（5.0/1.8）放宽，
    # 属安全门禁阈值而非真实额定——高位形保位需留意发热。
    # L1 受力较小降到 6；L2/L3 高位形保位放宽到 8；EL05 腕部到 4。
    joint_rated_torque: [6, 8, 8, 4, 4, 4, 2]

    # ═══════════════════════════════════════════════════════════════════
    # 11. 温度管理（F44）
    # ═══════════════════════════════════════════════════════════════════
    temp_protect_enabled: true
    # 生产阈值 90(warn)/95(protect)（LL-023 调高值）；临时改 60/65 做过温保护验证。
    # F138：整定 duty cycle 高，protect 95→100、hysteresis 5→10（恢复仍 90）拉长标定时长。
    temp_warn_c: 90.0
    temp_protect_c: 100.0
    temp_hysteresis_c: 10.0

    # ═══════════════════════════════════════════════════════════════════
    # 12. 故障 / 限位（F48）
    # ═══════════════════════════════════════════════════════════════════
    fault_mask_reset_on_fault: true
    enable_position_check: true             # 使能前读数限位门禁
    position_check_margin_rad: 0.035        # 限位比较裕量（2°）
    js_max_stale_s: 1.0                     # /joint_states 最大陈旧时长

    # ═══════════════════════════════════════════════════════════════════
    # 13. 带外失能监视（F51/LL-039）
    # ═══════════════════════════════════════════════════════════════════
    monitor_status_topic: /a3/monitor/status
    unexpected_disable_guard: true
    unexpected_disable_sustain_s: 1.0       # 须比 arm_monitor.yaml(0.5s) 长

    # ═══════════════════════════════════════════════════════════════════
    # 14. 轨迹文件 / 自由拖动 / 夹爪（F127）
    # ═══════════════════════════════════════════════════════════════════
    trajectories_dir: "~/.a3/trajectories"
    named_poses_pkg: a3_description
    freedrive_gripper_controller: gripper_controller
    # L7 夹爪按录制时间序列步进下发：20ms 步进 + 线性插值；l7_max_velocity 硬限速
    l7_seq_tick_s: 0.02
    l7_seq_min_delta_rad: 0.01
    l7_max_velocity_rad_s: 0.6
