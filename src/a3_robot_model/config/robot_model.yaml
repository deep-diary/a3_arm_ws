# A3 系统级机器人模型配置（F174）
#
# 作用：指定「默认机器人描述」——URDF/xacro 所在包及其配套档位文件（SRDF / controllers /
#       motor_map / joint_names），真机栈与仿真栈共用同一份，避免各 launch/节点写死包名。
#
# 覆盖顺序（后者按字段覆盖前者）：
#   1. 本文件（随仓库版本管理的默认值）
#   2. ~/.a3/robot_model.yaml（本机覆盖：例如某台仿真机想换回 7 轴形态或换标定包）
#
# 读取方：a3_bringup（产品入口 launch 与各节点）、a3_arm_controller（限位/命名位姿）、
#         scripts/a3_stack.sh（起栈默认档位）。
#
# 默认档：6 轴（L1–L6）+ 末端连杆（a3_description_6j，见 F174）。
robot_model:
  # 描述包名（提供 urdf/、config/、meshes/ 的包）
  description_package: a3_description_6j
  # 以下三个路径相对 description_package
  urdf_xacro: urdf/el_a3.urdf.xacro
  urdf_static: urdf/el_a3.urdf          # 静态 URDF（Pinocchio / 限位读取用）
  controllers: config/el_a3_controllers.yaml
  # 关节名：顺序即 L1..Ln（/joint_states 顺序、编排层 joint_names）
  joint_names: [L1_joint, L2_joint, L3_joint, L4_joint, L5_joint, L6_joint]
  # 是否含夹爪电机（决定 gripper_controller、上游 gripper 话题与手柄夹爪键位）
  include_gripper: false
  # MoveIt 语义描述（相对 a3_moveit_config/config）
  srdf: el_a3_6j.srdf
  # 执行层电机映射（相对 a3_can_bridge/config；真机 power_sequence 用）
  motor_map: motor_map_6j.yaml
