# PS4 模式化按键映射（F189）。改绑定只改本文件，不用改代码。
#
# 结构：common（固定层，所有模式生效）+ modes（每个模式可覆盖同名轴/键、可屏蔽公共轴）。
# 选模式：**按住 Share + 方向/面键**直接点名（不循环）：
#   Share+↑ TEACH / Share+↓ WAYPOINT / Share+← TRACK / Share+→ PIANO
#   Share+△ DEMO / Share+○ DANCE / Share+□ NORMAL
# 统一退出：Options 短按 → 回 NORMAL（示教类先保存）。
#
# 固定层（所有模式）：
#   Cross 长按 1s=硬急停(断电) / L3=上电+使能 / R3=软失能(safe-park) / L1+R1 长按 2s=init
#   L1+摇杆=末端平移 / R1+摇杆=末端旋转 / R2=夹爪力控
#
# 详细操作手册：docs/edge/PS4_OPERATOR_GUIDE.md

speed_normal: 0.35
joy_alive_ticks: 25

common:
  axes:
    r2:
      fn: gripper_force
      kind: analog_01
      source: trigger
    left_x:
      - fn: servo_lin_y        # L1：平移 Y（左右）
        kind: analog_n11
        gates: [l1]
      - fn: servo_ang_x        # R1：绕基座 X 滚转
        kind: analog_n11
        gates: [r1]
    left_y:
      fn: servo_lin_z
      kind: analog_n11
      gates: [l1]
    right_y:
      - fn: servo_lin_x        # L1：平移 X（前后）
        kind: analog_n11
        gates: [l1]
      - fn: servo_ang_y        # R1：绕基座 Y 俯仰
        kind: analog_n11
        gates: [r1]
    right_x:
      fn: servo_ang_z          # R1：绕基座 Z 偏航
      kind: analog_n11
      gates: [r1]
  buttons:
    cross:
      fn: power_shutdown
      edge: longpress
      hold_s: 1.0
    l1_r1:
      fn: arm_init
      edge: longpress
      hold_s: 2.0
    l3:
      fn: arm_power_enable
      edge: rising
    r3:
      fn: arm_disable
      edge: rising
  dpad: []

modes:
  select:
    modifier: share
    bindings:
      dpad_up: teach
      dpad_down: waypoint
      dpad_left: track
      dpad_right: piano
      triangle: demo
      circle: dance
      square: normal
  exit:
    button: options
    edge: shortpress
    hold_s: 1.5

  normal:
    label: NORMAL
    color: green
    pattern: solid
    rumble_index: 1
    enter: []
    exit: []
    dpad:
      - axis: dpad_y
        neg: {fn: goto_named_pose, kwargs: {name: home}}      # ↑ = home
        pos: {fn: goto_named_pose, kwargs: {name: idle}}      # ↓ = idle
      - axis: dpad_x
        neg: {fn: goto_named_pose, kwargs: {name: normal_slot_left}}   # ← = 前
        pos: {fn: goto_named_pose, kwargs: {name: normal_slot_right}}  # → = 后
    buttons:
      triangle:
        - {fn: goto_named_pose, kwargs: {name: ready}, edge: shortpress, hold_s: 1.5}
        - {fn: playback_latest, edge: longpress, hold_s: 1.5}
      square:
        - {fn: save_named_pose, edge: shortpress, hold_s: 1.5}
        - {fn: playback_waypoints_ptp, edge: longpress, hold_s: 1.5}
      circle:
        - {fn: arm_stop, edge: shortpress, hold_s: 1.5}
        - {fn: playback_waypoints_lin, edge: longpress, hold_s: 1.5}
      l2: {fn: save_named_pose, edge: shortpress, hold_s: 1.5}

  teach:
    label: TEACH
    color: blue
    pattern: breathe
    rumble_index: 2
    # 进模式即准备拖动（未使能会自动上电+使能，READY 后自动开录）——F189 修复
    enter: [{fn: teach_enter}]
    exit: [{fn: teach_leave}]
    buttons:
      triangle: {fn: teach_toggle, edge: shortpress, hold_s: 1.5}
      l2: {fn: save_pose_or_capture, edge: shortpress, hold_s: 1.5}

  waypoint:
    label: WAYPOINT
    color: cyan
    pattern: breathe
    rumble_index: 3
    enter: [{fn: teach_enter, kwargs: {kind: waypoint}}]
    exit: [{fn: teach_leave}]
    buttons:
      triangle: {fn: waypoint_toggle, edge: shortpress, hold_s: 1.5}
      l2: {fn: save_pose_or_capture, edge: shortpress, hold_s: 1.5}

  track:
    label: TRACK
    color: purple
    pattern: breathe
    rumble_index: 4
    # 跟踪要独占 twist：屏蔽 4 根摇杆轴，保留 R2 夹爪
    suppress_common_axes: [left_x, left_y, right_x, right_y]
    enter: [{fn: face_track_enable, required: true}]
    exit: [{fn: face_track_disable}]
    buttons:
      # 短按 = 开关/查询；长按 = 标定（F191），全部长按避免与短按混淆
      triangle:
        - {fn: face_track_toggle, edge: shortpress, hold_s: 1.5}
        - {fn: face_track_reload_jacobian, edge: longpress, hold_s: 2.0}
      circle:
        - {fn: vision_toggle_mesh, edge: shortpress, hold_s: 1.5}
        - {fn: face_track_record_target, edge: longpress, hold_s: 1.5}
      square:
        - {fn: face_track_status, edge: shortpress, hold_s: 1.5}
        - {fn: face_track_calibrate_depth, edge: longpress, hold_s: 1.5}
      l2: {fn: save_named_pose, edge: shortpress, hold_s: 1.5}

  piano:
    label: PIANO
    color: yellow
    pattern: breathe
    rumble_index: 5
    suppress_common_axes: [left_x, left_y, right_x, right_y]
    enter: [{fn: goto_named_pose, kwargs: {name: melodion_white1}, required: false}]
    exit: []
    # F195 口风琴应用：↓ 演奏路点示教 / ← 4 极限键录制 / → 结束并保存 / ↑ 生成 stream
    dpad:
      - axis: dpad_y
        neg: {fn: melodion_gen_streams}       # ↑ 生成 press + extremes stream
        pos: {fn: melodion_record_press}      # ↓ 演奏路点示教
      - axis: dpad_x
        neg: {fn: melodion_record_extremes}   # ← 4 极限键录制
        pos: {fn: teach_leave}                # → 结束示教并保存当前槽位
    buttons:
      triangle: {fn: playback_stream, kwargs: {name: press}, edge: shortpress, hold_s: 1.5}
      circle: {fn: playback_stream, kwargs: {name: extremes}, edge: shortpress, hold_s: 1.5}
      square: {fn: playback_stream, kwargs: {name: music}, edge: shortpress, hold_s: 1.5}
      l2: {fn: save_named_pose, edge: shortpress, hold_s: 1.5}

  demo:
    label: DEMO
    color: white
    pattern: breathe
    rumble_index: 6
    # 进入先回 home 工作位，再执行巡游（避免在任意姿态直接大范围运动）
    enter: [{fn: goto_named_pose, kwargs: {name: home}, required: false}]
    # 退出：先停角度巡航，再停运动（Options 短按 = 停止并退出）
    exit: [{fn: demo_angular_stop}, {fn: arm_stop}]
    # 巡航期间禁止摇杆发 twist（否则两路 twist 抢同一话题），R2 夹爪保留
    suppress_common_axes: [left_x, left_y, right_x, right_y]
    buttons:
      # 短按 = 固定三轴平移（只平移）；长按 = 随机方向平移（只平移）
      triangle:
        - {fn: demo_translate_xyz, edge: shortpress, hold_s: 1.5}
        - {fn: demo_random_translation, edge: longpress, hold_s: 1.5}
      # 短按 = 固定三轴旋转（只旋转）；长按 = 随机轴旋转（只旋转）
      circle:
        - {fn: demo_angular_xyz, edge: shortpress, hold_s: 1.5}
        - {fn: demo_angular_random, edge: longpress, hold_s: 1.5}
      square: {fn: random_pose_tour, edge: shortpress, hold_s: 1.5}
      l2: {fn: save_named_pose, edge: shortpress, hold_s: 1.5}

  dance:
    label: DANCE
    color: magenta
    pattern: breathe
    rumble_index: 7
    enter: [{fn: goto_named_pose, kwargs: {name: ready}, required: false}]
    exit: [{fn: arm_stop}]
    buttons:
      triangle: {fn: playback_latest, edge: shortpress, hold_s: 1.5}
      square: {fn: playback_waypoints_ptp, edge: shortpress, hold_s: 1.5}
      circle: {fn: arm_stop, edge: shortpress, hold_s: 1.5}
      l2: {fn: save_named_pose, edge: shortpress, hold_s: 1.5}
