# Default PS4 → A3 mapping (F60/F64；F115 修订 2026-09-26 D-pad 改绑 home 偏移点位；F120 Triangle 改绑 home). Change this file to rebind; no code change needed.
# Source names: buttons/axes keys from ds4_linux.yaml, plus virtual_buttons.
#
# == 全功能速查（完整操作手册见 docs/edge/PS4_OPERATOR_GUIDE.md，参考表见本包 README.md）==
#   电源:      L3 短按=一键上电开门禁+使能 / R3 短按=任意模式软失能(F119:先退出当前模式→F40 safe-park→失能) / Cross 长按 1s=硬急停(断电关闸)
#   位姿:      Triangle 短按=home（F120）/ Circle 短按=idle（自然趴着位，非机械零位；zero 不绑定手柄）
#              D-pad=home 周边 4 点（F115）：上=home_up / 下=home_down / 左=home_back / 右=home_front
#   示教:      Share 短按=连续录制 / Share 长按 1.5s=路点录制（L2 打点，Options 结束保存）
#              Options 短按=结束并自动保存（按当前录制类型分派）
#              Square 短按=连续回放 / Square 长按 1.5s=路点 PTP 回放
#              Circle 短按=idle / Circle 长按 1.5s=路点 LIN 直线回放
#              Options 长按 3s=F116 随机点位巡游（READY 态才执行；TEACH/WAYPOINT_TEACH 等态被服务端拒绝）
#   点位:      L2 短按=保存当前位姿为 snap_YYYYMMDD_HHMMSS（F114，写包内 named_poses.yaml）
#   功能:      L1+R1 同按长按 2s=init(调零+自动使能)（F135：PS 为开机键易误触，已解绑）
#   运动:      L1 按住+摇杆=末端平移死人开关 / R1 按住+摇杆=末端旋转死人开关(首批仅偏航)
#              左摇杆=平移 Y(左右)/Z(上下)；右摇杆上下=平移 X(前后)，右摇杆左右=偏航
#              （F115 起 D-pad 调速退役，平移/旋转恒用 speed_normal 默认档）
#   夹爪:      R2=直接力控（不需要 L1/R1），按得越深抓得越紧，松开即全开
#   触摸:      触摸板单击 tap=路点 LIN 回放（F132，与 Circle 长按等效；需 hid 节点）
#              物理触摸板"点击键"蓝牙仍不可用（LL-052），手势走 HID 数据链另测

# 初始速度档（平移/旋转共用；F115 起 D-pad 不再调速，step_*_scale 函数保留供自定义映射）
speed_normal: 0.35

axes:
  r2:
    fn: gripper_force
    kind: analog_01
    source: trigger
  left_x:
    fn: servo_lin_y
    kind: analog_n11
    gates: [l1]
  left_y:
    fn: servo_lin_z
    kind: analog_n11
    gates: [l1]
  right_y:
    fn: servo_lin_x
    kind: analog_n11
    gates: [l1]
  right_x:
    fn: servo_ang_z
    kind: analog_n11
    gates: [r1]

# F115：D-pad hat 轴（-1/0/+1）0→±1 边沿各触发一次；持续按住不连发，回中后才能再按。
# 上/下/左/右 = home 周边 4 个笛卡尔偏移命名点（走 goto_named_pose → F67 MoveIt）。
dpad:
  - axis: dpad_y
    neg: {fn: goto_named_pose, kwargs: {name: home_up}}      # 上：home 上方 15cm
    pos: {fn: goto_named_pose, kwargs: {name: home_down}}    # 下：home 下方 10cm
  - axis: dpad_x
    neg: {fn: goto_named_pose, kwargs: {name: home_back}}    # 左：home 后方 20cm
    pos: {fn: goto_named_pose, kwargs: {name: home_front}}   # 右：home 前方 15cm

buttons:
  cross:
    fn: power_shutdown
    edge: longpress
    hold_s: 1.0
  triangle:
    fn: goto_named_pose
    kwargs: {name: home}
    edge: rising
  circle:
    # F131: 短按=idle 位姿；长按 1.5s=路点 LIN 直线回放（触摸板单击手势实测可靠后将并存）
    - fn: goto_named_pose
      kwargs: {name: idle}
      edge: shortpress
      hold_s: 1.5
    - fn: playback_waypoints_lin
      edge: longpress
      hold_s: 1.5
  share:
    # F131: 短按=连续录制；长按 1.5s=路点录制（L2 打点，Options 保存）
    - fn: teach_start
      edge: shortpress
      hold_s: 1.5
    - fn: teach_start_waypoint
      edge: longpress
      hold_s: 1.5
  options:
    # F91: 长按调零已退役（产品栈无消费者；零点维护走 motor_maintenance 独立节点）
    - fn: teach_stop
      edge: shortpress
      hold_s: 3.0
    # F116: 长按 3s 随机命名点巡游；同键短按语义不变（ButtonEdgeTracker 双键义）
    - fn: random_pose_tour
      edge: longpress
      hold_s: 3.0
  square:
    # F131: 短按=连续轨迹回放；长按 1.5s=路点 PTP 回放（kind 门禁，防连续轨迹被逐段规划）
    - fn: playback_latest
      edge: shortpress
      hold_s: 1.5
    - fn: playback_waypoints_ptp
      edge: longpress
      hold_s: 1.5
  # F135: init 从 PS 键迁到 L1+R1 组合键长按（PS 是手柄开机/唤醒键，开机过程易误触）。
  # 用 longpress 而非 shortpress：必须双键持续同按 2s，避免 jog 时 L1/R1 短暂交叠误触发；
  # 即使误触发，SERVO/TRAJ/TEACH 等 busy 态下 init 会被编排层状态机拒绝（双保险）。
  l1_r1:
    fn: arm_init
    edge: longpress
    hold_s: 2.0
  l3:
    fn: arm_power_enable
    edge: shortpress
    hold_s: 3.0
  r3:
    fn: arm_disable
    edge: shortpress
    hold_s: 3.0
  l2:
    # F114: 示教/任意时刻一键保存当前位姿（空名 → 服务端自动命名 snap_*）
    # F131: WAYPOINT_TEACH 态 L2 路由为打点（不写 named_poses.yaml）
    fn: save_named_pose
    edge: shortpress
    hold_s: 3.0

# F132: 触摸板手势（数据源 ds4_hid_node 的 /a3/ds4/touch；需 enable_hid:=true）。
# 暂缓启用：ds4_hid_node 蓝牙模式触摸偏移存在固件兼容问题（实测部分区域接触被误判为未接触），
# 待专门修复后再启用；当前用 Circle 长按 1.5s 作为路点 LIN 回放入口。
# touch:
#   tap:
#     fn: playback_waypoints_lin
#     max_dur_s: 0.4
#     max_move: 0.08
