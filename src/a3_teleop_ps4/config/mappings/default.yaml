# Default PS4 → A3 mapping. Change this file to rebind; no code change needed.
# Source names: buttons/axes keys from ds4_linux.yaml, plus virtual_buttons.
#
# == 全功能速查（F55；完整操作手册见本包 README.md）==
#   示教三键:  Share 短按=开始示教 / Options 短按=结束示教(自动保存) / Circle 短按=执行回放(latest)
#   功能键:    PS=init(蓝牙下触摸板按键不进 js0, 唤醒改用 PS) / L3=使能 / R3=失能
#   双义键:    Options 短按=teach_stop, 长按 3s=调零 (buttons 用 list 绑两条, 各自独立边沿)
#   安全键:    Triangle 长按=关机(唯一手柄急停) / Square 长按=上电 / Cross=立即停 / L1=死人开关

deadman:
  enabled: true
  button: l1
  applies_to: [analog_01, analog_n11]

# Default speed when R1 is not held.
speed_normal: 0.35
speed_boost: 1.0

axes:
  r2:
    fn: gripper_force
    kind: analog_01
    source: trigger
  right_x:
    fn: servo_lin_y
    kind: analog_n11
  right_y:
    fn: servo_lin_z
    kind: analog_n11
  left_y:
    fn: servo_lin_x
    kind: analog_n11
  left_x:
    fn: servo_ang_z
    kind: analog_n11
  # Optional HID extras (enable after ds4_hid_node is up):
  # gyro_yaw:
  #   fn: servo_ang_z
  #   kind: analog_n11
  # touch_x:
  #   fn: servo_lin_y
  #   kind: analog_n11

buttons:
  dpad_up:
    fn: goto_named_pose
    kwargs: {name: ready}
    edge: rising
  dpad_down:
    fn: goto_named_pose
    kwargs: {name: zero}
    edge: rising
  dpad_left:
    fn: goto_named_pose
    kwargs: {name: home}
    edge: rising
  dpad_right:
    fn: goto_named_pose
    kwargs: {name: ready}
    edge: rising
  cross:
    fn: stop_motion
    edge: rising
  square:
    fn: power_start
    edge: longpress
    hold_s: 1.0
  triangle:
    fn: power_shutdown
    edge: longpress
    hold_s: 1.0
  # F55：示教三键 + 功能键 + 双义键
  share:
    fn: teach_start
    edge: shortpress
    hold_s: 3.0
  options:
    # 双义：短按(释放时 <3s)=结束示教；长按 3s=调零（互斥，长按不会连带触发短按）
    - fn: teach_stop
      edge: shortpress
      hold_s: 3.0
    - fn: power_set_zero
      edge: longpress
      hold_s: 3.0
  circle:
    fn: playback_latest
    edge: shortpress
    hold_s: 3.0
  ps:
    fn: arm_init
    edge: shortpress
    hold_s: 3.0
  # 蓝牙下触摸板按键在独立 input 设备("Wireless Controller Touchpad")，js0 收不到 → 不绑定；
  # 有线(insmod ds4_generic.ko)时触摸板键可能回到 js0，届时若需再启用。
  # touchpad:
  #   fn: arm_init
  #   edge: shortpress
  #   hold_s: 3.0
  l3:
    fn: arm_enable
    edge: shortpress
    hold_s: 3.0
  r3:
    fn: arm_disable
    edge: shortpress
    hold_s: 3.0

held:
  r1:
    fn: set_speed_scale
    kind: analog_01
    pressed: 1.0
    released: 0.35
