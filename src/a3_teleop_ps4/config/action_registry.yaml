# Action function catalog. Bindings in mappings/*.yaml must use these names.
# discrete: no runtime argument (kwargs frozen at bind time)
# analog_01: float in [0, 1]
# analog_n11: float in [-1, 1]

functions:
  goto_named_pose:
    kind: discrete
    kwargs: {name: string}
    description: Call /a3/arm/goto_named_pose (F60; 编排层插值, TRAJ 态, zero/idle/ready)

  save_named_pose:
    kind: discrete
    description: 'F114 L2: save current pose via /a3/arm/save_named_pose (空名 → snap_YYYYMMDD_HHMMSS, 写包内 named_poses.yaml)'

  arm_power_enable:
    kind: discrete
    description: F60 L3 一键上电开门禁 + 使能（power start 后轮询 gate/Running 再异步 enable，非阻塞）

  power_start:
    kind: discrete
    description: Publish /power_sequence/command start

  power_shutdown:
    kind: discrete
    description: Publish /power_sequence/command shutdown

  stop_motion:
    kind: discrete
    description: Zero Twist and abort named-pose motion

  servo_start:
    kind: discrete
    description: Call /servo_node/start_servo

  gripper_open:
    kind: discrete
    description: L7 to open (0 rad, 2026-09-06 标定)

  gripper_close:
    kind: discrete
    description: L7 to close (1.79 rad)

  gripper_toggle:
    kind: discrete
    description: Toggle L7 between close and open

  step_linear_scale:
    kind: discrete
    description: 'F64 D-pad: step translation speed scale (kwargs delta, step 0.15, clamp 0.1..1.0)'

  step_angular_scale:
    kind: discrete
    description: 'F64 D-pad: step rotation speed scale (kwargs delta, step 0.15, clamp 0.1..1.0)'

  zero_torque_start:
    kind: discrete
    description: Call /a3/zero_torque/start (no-op if service missing)

  zero_torque_stop:
    kind: discrete
    description: Call /a3/zero_torque/stop

  arm_init:
    kind: discrete
    description: Call /a3/arm/init (依编排层状态机初始化; 越限只 WARN)

  arm_enable:
    kind: discrete
    description: "Call /a3/arm/enable (使能安全门禁: 目标重锚到反馈位 + 软起步)"

  arm_disable:
    kind: discrete
    description: "Call /a3/arm/disable (F40: 离 idle 先 safe park 再失能)"

  teach_start:
    kind: discrete
    description: Call /a3/arm/start_teach (切零力矩拖动 + 开始记录)

  teach_stop:
    kind: discrete
    description: Call /a3/arm/stop_teach (停止记录 + F54 自动保存)

  arm_stop:
    kind: discrete
    description: 'F190: Call /a3/arm/stop（切模式前先停运动；TEACH 先保存再回 READY）'

  teach_enter:
    kind: discrete
    description: 'F189 进入示教：READY 直接开录；未使能先上电+使能，READY 后自动开录（kwargs kind=teach|waypoint）'

  teach_leave:
    kind: discrete
    description: F189 退出示教：丢弃挂起请求，录制中则 stop_teach（自动保存）

  teach_toggle:
    kind: discrete
    description: 'F189 TEACH 模式 Triangle：未录制→开始；录制中→stop_teach'

  waypoint_toggle:
    kind: discrete
    description: 'F189 WAYPOINT 模式 Triangle：未录制→开始路点示教；录制中→打点'

  save_pose_or_capture:
    kind: discrete
    description: 'F189 L2：WAYPOINT_TEACH 下服务端路由为打点，否则保存当前位姿'

  face_track_enable:
    kind: discrete
    description: 'F189 TRACK 进入：/a3/face_track/enable true（服务不可用返回 false）'

  face_track_disable:
    kind: discrete
    description: 'F189 TRACK 退出：/a3/face_track/enable false'

  face_track_toggle:
    kind: discrete
    description: 'F189 TRACK Triangle：跟踪开/关切换'

  face_track_status:
    kind: discrete
    description: 'F191 TRACK Square 短按：查询跟踪状态与标定值（enabled/err/z/z_ref/target/jac）'

  face_track_record_target:
    kind: discrete
    description: 'F191 TRACK Circle 长按：水平/竖向 + 前后目标标定（当前脸位置与距离记为新目标，写 ~/.a3/camera/face_target.yaml）'

  face_track_calibrate_depth:
    kind: discrete
    description: 'F191 TRACK Square 长按：前后（深度）标定（脸放 200 mm，按 z 中位数缩放 depth_units_mm，写 face_calib.yaml）'

  face_track_reload_jacobian:
    kind: discrete
    description: 'F191 TRACK Triangle 长按：重载 ~/.a3/camera/face_jacobian.yaml（离线脚本产物）'

  vision_toggle_mesh:
    kind: discrete
    description: 'F194 网格点/网格线/人脸框显示开关（画面中心与人脸中心始终保留）'

  demo_tour_home:
    kind: discrete
    description: 'F189 DEMO：home 五向平移巡游（random_pose_tour 固定序列）'

  demo_angular_xyz:
    kind: discrete
    description: 'F193 DEMO Circle 短按：固定三轴角度巡航（X→Y→Z 各摆一轮，绕末端点、位置保持）'

  demo_translate_xyz:
    kind: discrete
    description: 'F193 DEMO Triangle 短按：固定三轴平移巡航（X→Y→Z 各 0→+A→−A→0，末端只平移不旋转）'

  demo_angular_spin:
    kind: discrete
    description: 'F193 备用：旋转巡游（偏航往复连续，再按停止）；当前 DEMO 按键未绑定'

  demo_angular_random:
    kind: discrete
    description: 'F193 DEMO Circle 长按：随机角度巡游（每轮随机轴+随机幅度，再按停止）'

  demo_angular_stop:
    kind: discrete
    description: 'F193 停止角度巡航（DEMO 退出时调用）'

  demo_random_translation:
    kind: discrete
    description: 'F193 DEMO Triangle 长按：平移随机巡游（锁姿态，±6cm/上下±5cm 随机 6 点）'

  playback_latest:
    kind: discrete
    description: 'Call /a3/arm/playback {name:""} (空名 ≡ 回放 latest)'

  teach_start_waypoint:
    kind: discrete
    description: 'F131 Share 长按 1.5s: Call /a3/arm/start_waypoint_teach（零力矩拖动 + L2 打点 + Options 保存）'

  playback_waypoints_ptp:
    kind: discrete
    description: 'F131 Square 长按 1.5s: 路点关节空间回放 {type:"waypoint", strategy:"ptp"}（服务端 kind 门禁）'

  playback_waypoints_lin:
    kind: discrete
    description: 'F131 Circle 长按 1.5s / 触摸板单击: 路点笛卡尔直线回放 {type:"waypoint", strategy:"lin"}；直线跨奇异/超限即拒，不回落 PTP'

  playback_stream:
    kind: discrete
    description: 'F176 Triangle 长按 1.5s: 回放 4 键按压 stream {type:"stream", name:"latest"}（trajectories/streams/latest.yaml，melodion_pts2stream.py 产物）'

  random_pose_tour:
    kind: discrete
    description: 'F116 Options 长按 3s: Call /a3/arm/random_pose_tour（READY 态抽命名点逐点 MoveIt 巡游；可选 kwargs count/seed）'

  set_gripper:
    kind: analog_01
    description: q_L7 = v * 1.79 rad (legacy alias, 0 closed .. 1 open)

  gripper_force:
    kind: analog_01
    description: R2 trigger -> /a3/gripper/command force (0.2..1 maps 0.1..1.0 Nm); release on falling edge (F36)

  set_joint_L6:
    kind: analog_01
    description: L6 position from trigger 0..1 maps joint lower..upper

  set_joint_L7:
    kind: analog_01
    description: L7 gripper position from trigger 0 closed .. 1 open

  servo_lin_x:
    kind: analog_n11
    description: End-effector linear X (forward/back)

  servo_lin_y:
    kind: analog_n11
    description: End-effector linear Y (left/right)

  servo_lin_z:
    kind: analog_n11
    description: End-effector linear Z (up/down)

  servo_ang_x:
    kind: analog_n11
    description: End-effector roll

  servo_ang_y:
    kind: analog_n11
    description: End-effector pitch

  servo_ang_z:
    kind: analog_n11
    description: End-effector yaw

  joint_jog_L1:
    kind: analog_n11
    description: Legacy incremental jog L1 (unbound by default)

  joint_jog_L2:
    kind: analog_n11
    description: Legacy incremental jog L2

  joint_jog_L3:
    kind: analog_n11
    description: Legacy incremental jog L3

  joint_jog_L4:
    kind: analog_n11
    description: Legacy incremental jog L4

  joint_jog_L5:
    kind: analog_n11
    description: Legacy incremental jog L5

  joint_jog_L6:
    kind: analog_n11
    description: Legacy incremental jog L6
