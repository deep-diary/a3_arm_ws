# DualShock 4 on Linux (hid-sony / hid-playstation → /dev/input/js*).
# Calibrate with: ros2 run a3_teleop_ps4 joy_dump
# Indices below match the common kernel mapping; overwrite after dump.

deadzone: 0.12

# Stick / D-pad rest at 0. Triggers rest at +1, full press at -1.
trigger_rest: 1.0
trigger_pressed: -1.0

# Invert after reading raw axis (Linux left/right Y: -1 is typically up).
invert_axes:
  left_y: true
  dpad_y: false

buttons:
  cross: 0
  circle: 1
  triangle: 2
  square: 3
  l1: 4
  r1: 5
  l2: 6
  r2: 7
  share: 8
  options: 9
  ps: 10
  l3: 11
  r3: 12
  touchpad: 13

axes:
  left_x: 0
  left_y: 1
  l2: 2
  right_x: 3
  right_y: 4
  r2: 5
  dpad_x: 6
  dpad_y: 7

# Virtual buttons from D-pad axes (Linux: -1 left/up, +1 right/down).
virtual_buttons:
  dpad_up:
    axis: dpad_y
    op: lt
    threshold: -0.6
    release_threshold: 0.35
  dpad_down:
    axis: dpad_y
    op: gt
    threshold: 0.6
    release_threshold: 0.35
  dpad_left:
    axis: dpad_x
    op: lt
    threshold: -0.6
    release_threshold: 0.35
  dpad_right:
    axis: dpad_x
    op: gt
    threshold: 0.6
    release_threshold: 0.35
