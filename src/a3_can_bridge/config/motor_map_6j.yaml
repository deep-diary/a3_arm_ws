/**:
  ros__parameters:
    # 控臂总线：can0 或 can1。切换总线只需改这里并重启栈，无需重编译。
    arm_bus: can1
    # ---- F52 运行期档位（6J 档，无 L7 夹爪）----
    # joint_names[i] ↔ motor_ids_by_index[i]，下标即轨迹关节位；两项必须等长。
    # 6 关节臂（拆掉夹爪电机 7）：power_sequence_node 的 set_zero/save/参数广播
    # 只发给 1..6；硬件插件按 URDF（include_gripper:=false）只声明 L1-L6。
    motor_ids_by_index: [1, 2, 3, 4, 5, 6]
    joint_names: [L1_joint, L2_joint, L3_joint, L4_joint, L5_joint, L6_joint]
