# F138 — MIT 位置环增益（启动时覆盖 xacro 关节参数；从此调增益只改本文件）
#
# 生效方式：改完重启栈（scripts/a3_stack.sh restart）。
# 运行中临时试参：ros2 param set /a3_hardware_health kp_L2_joint 150.0（重启后以本文件为准）。
# 格式：joints.<关节名>.kp/.kd；只写需要覆盖的关节也可以。
# 物理依据：kd 随 √kp 增长保持阻尼比 ζ=kd/(2√(kp·J))（80/2 → 150 ⇒ kd≈2.7，
# 实测 2.5 消除到位余摆，见 docs/lessons_learned/LL-146 第三轮追加）。
#
# ── 历史参考（kp/kd 演进，git log 本文件可查历次变更）──────────────────
# 名义默认  kp=80.0 kd=2.0
#   ← 本仓初始保守起始值（a3_mit_hardware_interface.cpp kDefaultKp/kDefaultKd，
#     沿自 reBot 工具链/EDULITE 参考起始）。当初体感已可用，本文件整定是为更优化。
# 整定第 1 轮（2026-10-05，KP_MAX=120，0.2 rad 慢斜坡小幅激励）：
#   L1 40/2.0  L2 120/5.0  L3 120/2.0  L4 120/5.0  L5 120/0.5  L6 110/2.0
#   ← 真机 idle 折叠位标定，后因 idle 连杆干涉改 home 位；L1 标定激发 L3 耦合
#     振动（9.21 Nm 冲击）改半抬 home。
# 整定第 2 轮（2026-10-05，KP_MAX=150，home 半抬位）+ 实测修正：
#   L1 150/2.5  L2 150/2.5  L3 150/2.5  L4 150/4.5  L5 150/2.5  L6 100/2.5
#   ← 真机 idle→home 大行程实测：L2 kd=0.5 到位余摆 0.31°/0.25 rad/s，
#     kd=2.5 降 3.8×（整定器小幅单关节考核系统性偏小 kd，LL-146）。
#     用户确认：L3 受力最大抗外力 → kp=150；L5/L6 腕部同逻辑 kd=2.5。
# ──────────────────────────────────────────────────────────────────────
joints:
  # L1_joint: {kp: 150.0, kd: 2.5}   # 基座旋转，惯性负载大，高 kp 保响应
  # L2_joint: {kp: 150.0, kd: 2.5}   # 肩俯仰，重力负载最大；kd 0.5→2.5 实测消除到位余摆
  # L3_joint: {kp: 150.0, kd: 2.5}   # 肘俯仰，受力最大抗外力；kp 120→150 提刚度
  # L4_joint: {kp: 150.0, kd: 4.5}   # 腕滚转，惯量最小易高频振动，需最高阻尼
  # L5_joint: {kp: 150.0, kd: 2.5}   # 腕俯仰；kd 0.5→2.5 同 L2 逻辑
  # L6_joint: {kp: 100.0, kd: 2.5}   # 腕旋转，负载最小 kp=100 即可；kd 同步 2.5

  L1_joint: {kp: 100.0, kd: 4.0}
  L2_joint: {kp: 100.0, kd: 4.0}
  L3_joint: {kp: 100.0, kd: 4.0}
  L4_joint: {kp: 100.0, kd: 4.0}
  L5_joint: {kp: 100.0, kd: 4.0}
  L6_joint: {kp: 100.0, kd: 4.0}