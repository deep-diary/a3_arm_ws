# ros2_control controller configuration for EL-A3 robot arm

controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    # F83/LL-086: hardware starts INACTIVE — the operator enable (controller
    # switch claiming command interfaces) is the first activation. Humble
    # otherwise eagerly activates hardware at controller_manager boot.
    # The active JSB claims state interfaces only and does NOT trigger this.
    hardware_components_initial_state:
      inactive:
        - RsA3System

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: effort_controllers/GripperActionController

    zero_torque_controller:
      type: a3_hardware_interface/GravityCompensationController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0

arm_controller:
  ros__parameters:
    joints:
      - L1_joint
      - L2_joint
      - L3_joint
      - L4_joint
      - L5_joint
      - L6_joint

    # calculate_dynamics mock 不支持同一关节同时声明位置+速度起始指令接口，
    # 且 MIT 电机执行层以位置指令为准：工业标准 position-only
    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    open_loop_control: true
    allow_nonzero_velocity_at_trajectory_end: true
    interpolation_method: splines

    state_publish_rate: 200.0
    action_monitor_rate: 50.0

    constraints:
      stopped_velocity_tolerance: 0.1
      # F97: goal_time <= 0 disables the goal-time check — a goal the state
      # can never converge to would hang forever (F81 freeze-hold proved it).
      # Allow 1.0 s past the last trajectory point, then abort.
      goal_time: 1.0
      # F97: per-joint trajectory (tracking) tolerance aborts on deviation
      # mid-motion; goal tolerance gates convergence after the trajectory end.
      L1_joint:
        trajectory: 0.05
        goal: 0.03
      L2_joint:
        trajectory: 0.05
        goal: 0.03
      L3_joint:
        trajectory: 0.05
        goal: 0.03
      L4_joint:
        trajectory: 0.05
        goal: 0.03
      L5_joint:
        trajectory: 0.05
        goal: 0.03
      L6_joint:
        trajectory: 0.05
        goal: 0.03

gripper_controller:
  ros__parameters:
    joint: L7_joint
    action_monitor_rate: 20.0
    # L7 标定：开=0.0、闭≈1.79 rad
    goal_tolerance: 0.02
    # Default clamp used when a goal does not specify max_effort.
    max_effort: 1.0
    # Contact = stall; report success (stalled=true) instead of aborting.
    allow_stalling: true
    stall_velocity_threshold: 0.01
    stall_timeout: 0.5
    # Effort adapter PID: error -> joint effort, clamped to goal max_effort.
    gains:
      L7_joint: {p: 8.0, i: 0.0, d: 0.2, i_clamp: 0.0}

zero_torque_controller:
  ros__parameters:
    joints:
      - L1_joint
      - L2_joint
      - L3_joint
      - L4_joint
      - L5_joint
      - L6_joint
    # URDF resolved at configure time: controller node robot_description param,
    # then urdf_path file, then the controller_manager node parameter.
    robot_description: ""
    urdf_path: ""
    controller_manager_name: controller_manager
